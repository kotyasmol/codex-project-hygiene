name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  safety-suite:
    name: "Python ${{ matrix.python }} on ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.11", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Verify fail-closed process probes
        run: |
          command -v lsof
          command -v pgrep

      - name: Compile Python sources
        env:
          PYTHONPYCACHEPREFIX: "${{ runner.temp }}/codex-project-hygiene-pycache"
        run: >-
          python -m py_compile
          scripts/cleanup.py
          scripts/media_cleanup.py
          scripts/hygiene_audit.py
          scripts/install_policy.py
          tests/test_cleanup.py
          tests/test_media_cleanup.py
          tests/test_hygiene_audit.py
          tests/test_install_policy.py
          tests/test_package.py

      - name: Run synthetic safety tests
        env:
          PYTHONPYCACHEPREFIX: "${{ runner.temp }}/codex-project-hygiene-pycache"
        run: python -m unittest discover -s tests -v

      - name: Check whitespace and conflict markers
        run: |
          if git grep -nI -E '[[:blank:]]+$' -- '*.py' '*.md' '*.yml' '*.yaml'; then exit 1; fi
          if git grep -nI -E '^(<<<<<<<|=======|>>>>>>>)' -- '*.py' '*.md' '*.yml' '*.yaml'; then exit 1; fi
