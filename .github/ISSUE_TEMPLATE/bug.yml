name: Bug report
description: Report incorrect scan, token, apply, or recovery behavior using sanitized synthetic data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        **Do not upload real plans, galleries, images, Codex sessions, databases, secrets, or absolute home paths.** Reproduce the problem in a temporary directory with synthetic files. Use the private security process for a containment or deletion-safety bypass.
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options:
        - Scan
        - Token
        - Trash apply
        - Permanent apply
        - Recovery
        - Generated-media gallery
        - Workspace-hygiene audit
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.3.0-beta or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, filesystem type, Python version, and desktop environment when Trash is involved.
      placeholder: macOS 15, APFS, Python 3.13
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include the smallest safe fixture layout and sanitized command. Replace usernames and private paths.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected fail-closed behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I used only synthetic data and removed secrets, usernames, real paths, prompts, images, plans, sessions, and database content.
          required: true
